name: Apply Dennis Nazar hero redesign

on:
  push:
    paths:
      - ".github/workflows/apply-hero-redesign.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install exact uploaded hero image
        run: |
          mkdir -p assets
          echo '' | base64 -d > assets/dennis-nazar-hero-real.webp

      - name: Apply hero content and premium editorial styling
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          html = html.replace(
              "Vitabu vinavyogusa maisha, mahusiano, kusudi, maamuzi na ukuaji binafsi — vikiwa vimeandikwa kwa mtazamo wa maisha halisi.",
              "Vitabu vinavyogusa maisha, kusudi na ukuaji binafsi — kwa mtazamo unaokuchochea kufikiri na kuchukua hatua."
          )
          html = html.replace("assets/dennis-nazar-hero-background.png", "assets/dennis-nazar-hero-real.webp")
          index.write_text(html, encoding="utf-8")

          css = Path("css/style.css")
          with css.open("a", encoding="utf-8") as f:
              f.write(r'''

/* ===== DENNIS NAZAR HERO — PREMIUM EDITORIAL REDESIGN ===== */
.hero{
  position:relative!important;
  isolation:isolate!important;
  min-height:760px!important;
  overflow:hidden!important;
  background:
    radial-gradient(circle at 76% 42%,rgba(70,101,151,.30),transparent 29%),
    linear-gradient(90deg,rgba(18,15,45,.97) 0%,rgba(18,15,45,.90) 31%,rgba(18,15,45,.58) 56%,rgba(18,15,45,.18) 100%),
    linear-gradient(180deg,rgba(11,9,31,.04) 45%,rgba(11,9,31,.84) 100%),
    url("assets/dennis-nazar-hero-real.webp") 72% center/cover no-repeat!important;
}
.hero::before{
  content:""!important;
  position:absolute!important;
  width:820px!important;
  height:820px!important;
  right:-310px!important;
  top:105px!important;
  border:1px solid rgba(255,255,255,.10)!important;
  border-radius:50%!important;
  box-shadow:0 0 0 70px rgba(255,255,255,.018),0 0 0 140px rgba(255,255,255,.012)!important;
  pointer-events:none!important;
  z-index:0!important;
}
.hero::after{
  content:""!important;
  position:absolute!important;
  left:0!important;
  right:0!important;
  bottom:0!important;
  height:180px!important;
  background:linear-gradient(180deg,transparent,rgba(18,15,45,.92))!important;
  pointer-events:none!important;
  z-index:0!important;
}
.hero-grid{
  position:relative!important;
  z-index:2!important;
  min-height:760px!important;
  align-items:center!important;
}
.hero-copy{
  position:relative!important;
  z-index:3!important;
  max-width:620px!important;
  padding-top:12px!important;
}
.hero .eyebrow{
  gap:14px!important;
  letter-spacing:.22em!important;
  font-size:11px!important;
  font-weight:800!important;
}
.hero .eyebrow span{
  width:54px!important;
  height:2px!important;
  background:var(--orange)!important;
}
.hero h1{
  max-width:640px!important;
  margin:24px 0 24px!important;
  font-size:clamp(54px,6.2vw,88px)!important;
  line-height:.94!important;
  letter-spacing:-.055em!important;
}
.hero h1 span{
  color:var(--orange)!important;
  font-style:italic!important;
}
.hero-lead{
  max-width:500px!important;
  margin:0!important;
  color:rgba(255,255,255,.78)!important;
  font-size:16px!important;
  line-height:1.72!important;
}
.hero-actions{
  margin-top:30px!important;
  gap:26px!important;
}
.hero-actions .primary-btn{
  min-height:52px!important;
  padding:0 27px!important;
  border-radius:8px!important;
  box-shadow:0 14px 34px rgba(244,119,33,.20)!important;
}
.hero-actions .secondary-link{
  color:#fff!important;
  border-bottom:1px solid rgba(255,255,255,.72)!important;
  padding-bottom:8px!important;
}
.hero-trust{
  margin-top:64px!important;
  gap:34px!important;
}
.hero-trust strong{
  font-family:"Playfair Display",serif!important;
  font-size:48px!important;
  line-height:.8!important;
}
.hero-trust span{
  font-size:9px!important;
  letter-spacing:.17em!important;
  line-height:1.45!important;
}
.trust-divider{
  height:52px!important;
  background:rgba(255,255,255,.24)!important;
}
@media(max-width:760px){
  .hero{
    min-height:720px!important;
    padding:58px 0 24px!important;
    background:
      linear-gradient(90deg,rgba(18,15,45,.97) 0%,rgba(18,15,45,.88) 36%,rgba(18,15,45,.46) 72%,rgba(18,15,45,.18) 100%),
      linear-gradient(180deg,rgba(18,15,45,.02) 40%,rgba(18,15,45,.86) 100%),
      url("assets/dennis-nazar-hero-real.webp") 76% center/auto 100% no-repeat!important;
  }
  .hero::before{
    width:500px!important;
    height:500px!important;
    right:-330px!important;
    top:145px!important;
    box-shadow:0 0 0 42px rgba(255,255,255,.015),0 0 0 84px rgba(255,255,255,.010)!important;
  }
  .hero::after{height:150px!important}
  .hero-grid{
    min-height:638px!important;
    align-items:flex-start!important;
  }
  .hero-copy{
    width:100%!important;
    max-width:320px!important;
    padding-top:16px!important;
  }
  .hero .eyebrow{
    font-size:9px!important;
    letter-spacing:.18em!important;
    gap:10px!important;
  }
  .hero .eyebrow span{width:34px!important}
  .hero h1{
    max-width:310px!important;
    margin:19px 0 18px!important;
    font-size:clamp(44px,12.5vw,58px)!important;
    line-height:.94!important;
    letter-spacing:-.05em!important;
  }
  .hero-lead{
    max-width:285px!important;
    font-size:13px!important;
    line-height:1.65!important;
    color:rgba(255,255,255,.76)!important;
  }
  .hero-actions{
    margin-top:24px!important;
    gap:20px!important;
    flex-wrap:wrap!important;
  }
  .hero-actions .primary-btn{
    min-height:48px!important;
    padding:0 20px!important;
    font-size:11px!important;
  }
  .hero-actions .secondary-link{
    font-size:10px!important;
  }
  .hero-trust{
    margin-top:34px!important;
    gap:18px!important;
  }
  .hero-trust strong{font-size:34px!important}
  .hero-trust span{
    font-size:7px!important;
    letter-spacing:.13em!important;
  }
  .trust-divider{height:38px!important}
}
@media(max-width:390px){
  .hero{
    min-height:690px!important;
    background-position:78% center!important;
  }
  .hero-grid{min-height:610px!important}
  .hero-copy{max-width:295px!important}
  .hero h1{font-size:42px!important}
  .hero-lead{font-size:12.2px!important;max-width:270px!important}
  .hero-trust{margin-top:28px!important}
}
''')
          css.write_text(css.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Commit hero redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dennis-nazar-hero-real.webp index.html css/style.css
          git commit -m "feat: redesign hero with real Dennis Nazar portrait"
          git push
