<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="theme-color" content="#181443"><title>Reading — Dennis Nazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/reader.css">
</head>
<body class="reader-page">
<header class="reader-nav"><div class="reader-nav-inner"><a href="library.html" class="reader-back" aria-label="Back to library"><i data-lucide="arrow-left"></i></a><div class="reader-book-title"><span>DENNIS NAZAR · READING</span><strong id="readerTitle">Loading book…</strong></div><div class="reader-actions"><span id="progressLabel">0%</span><a href="library.html" aria-label="My Library"><i data-lucide="library"></i></a></div></div></header>
<main class="reader-main"><div id="readerGate" class="reader-gate"><i data-lucide="shield-check"></i><h1>Private Reading</h1><p>Checking your book access…</p></div><section id="readerApp" class="reader-app" hidden><div class="reader-toolbar"><button id="prevBtn" class="reader-tool" disabled><i data-lucide="chevron-left"></i><span>Previous</span></button><div class="page-control"><label for="pageInput">PAGE</label><input id="pageInput" type="number" min="1" value="1"><span>/ <b id="pageCount">0</b></span></div><button id="nextBtn" class="reader-tool" disabled><span>Next</span><i data-lucide="chevron-right"></i></button></div><div class="reader-stage"><div id="pageLoading" class="page-loading"><i data-lucide="loader-circle"></i><span>Loading page…</span></div><div id="watermark" class="reader-watermark"></div><img id="pageImage" alt="Book page" draggable="false" hidden></div><div class="reader-footer"><div><strong id="progressText">0% complete</strong><span>Progress is saved automatically.</span></div><a href="library.html"><i data-lucide="library"></i> My Library</a></div></section><div id="readerError" class="reader-error" hidden></div></main>
<script src="js/store.js"></script><script src="js/reader.js"></script>
</body></html>
